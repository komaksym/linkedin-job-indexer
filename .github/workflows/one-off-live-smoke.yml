name: One-off live smoke

on:
  schedule:
    - cron: "50 13 24 7 *"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: github.event_name == 'schedule' || (github.event.issue.number == 1 && github.event.comment.body == '/live-smoke-20260724')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --dev
      - name: Prepare bounded configuration
        run: |
          cp config.example.toml smoke.toml
          sed -i 's/max_pages = 6/max_pages = 1/' smoke.toml
          sed -i 's/max_jobs = 0/max_jobs = 3/' smoke.toml
          sed -i 's/request_delay_seconds = 0.75/request_delay_seconds = 0.25/' smoke.toml
      - name: Run and capture live result
        run: |
          mkdir -p out
          set +e
          uv run linkedin-jobs run \
            --config smoke.toml \
            --db .data/smoke.sqlite3 \
            --out-dir out >out/console.txt 2>&1
          echo "$?" > out/exit-code.txt
          exit 0
      - name: Post evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          def read(path: str, limit: int = 12000) -> str:
              file = Path(path)
              if not file.exists():
                  return "<not created>"
              text = file.read_text(errors="replace")
              return text[:limit] + ("\n<truncated>" if len(text) > limit else "")

          exit_code = read("out/exit-code.txt").strip()
          console = read("out/console.txt")
          jobs = read("out/jobs.csv")
          report = read("out/report.json")
          now = datetime.now(timezone.utc).isoformat()
          body = f"""## One-off live smoke result

          Ran at `{now}`. Bounded to **1 search page** and **3 job descriptions**.

          **CLI exit code:** `{exit_code}`

          <details><summary>Console</summary>

          ```text
          {console}
          ```
          </details>

          <details><summary>jobs.csv</summary>

          ```csv
          {jobs}
          ```
          </details>

          <details><summary>report.json</summary>

          ```json
          {report}
          ```
          </details>
          """
          Path("/tmp/smoke-comment.md").write_text(body)
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            -f "body=$(cat /tmp/smoke-comment.md)"
