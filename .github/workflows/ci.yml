name: CI diagnostic

on:
  push:
  pull_request:

jobs:
  validation-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --dev
      - name: Capture validation outputs
        run: |
          uv run ruff check . > ruff.log 2>&1 || true
          uv run mypy > mypy.log 2>&1 || true
          uv run pytest > pytest.log 2>&1 || true
          uv run python -m build > build.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostic
          path: |
            ruff.log
            mypy.log
            pytest.log
            build.log
