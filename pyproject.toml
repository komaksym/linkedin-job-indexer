[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "linkedin-job-indexer"
version = "0.1.0"
description = "Daily best-effort indexer for public LinkedIn job postings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.28,<1",
]

[project.scripts]
linkedin-jobs = "linkedin_job_indexer.cli:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_job_indexer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["linkedin_job_indexer"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "bs4.*"
ignore_missing_imports = true
